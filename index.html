<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uni Textbook Marketplace – Games</title>

  <!-- Montserrat = the font from your brand guidelines -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .box h1,
    .box p {
      color: #fff;
    }

    .tag {
      color: #fff;
      font-size: .75rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      opacity: .85;
    }

    .picture {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin: 20px 0;
    }

    .picture img {
      width: 100%;
      height: auto;
      display: block;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .buttons a {
      flex: 1 1 180px;
    }

    .btn-light {
      background: #fff;
      color: var(--primary-foreground);
      border: 1px solid #fff;
    }

    .btn-light:hover {
      background: #e6f9fd;
    }
  </style>
</head>

<body class="auth-bg page">
  <div class="box">
    <div class="tag">Uni Textbook Marketplace</div>
    <h1>Play &amp; Win!</h1>
    <p>Test how well you know our project. Win and you get a prize.</p>

    <div class="picture">
      <img src="students.png" alt="A group of students holding textbooks">
    </div>

    <div class="buttons">
      <a class="btn-primary" href="pop-the-bubble.html">🫧 Pop the Bubble</a>
      <a class="btn-primary" href="crossword.html">🧩 Crossword</a>
      <a class="btn-primary btn-light" href="https://www.unitextbookmarketplace.co.za/" target="_blank" rel="noopener">🌐 Visit the
        Website</a>
    </div>
  </div>
</body>

</html>
